map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 192.168.10.30 almi-odoo localhost;

    # Parte PÚBLICA del certificado, para instalarlo en los Windows (3-certificado-odoo.ps1).
    # La clave privada (odoo.key) nunca se publica.
    location = /almichain-odoo.crt {
        alias /etc/ssl/almichain/odoo.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 192.168.10.30 almi-odoo localhost;

    ssl_certificate     /etc/ssl/almichain/odoo.crt;
    ssl_certificate_key /etc/ssl/almichain/odoo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    proxy_read_timeout   720s;

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host conserva el puerto (p. ej. localhost:8443 con el reenvío de puertos)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
