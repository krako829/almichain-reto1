[options]
admin_passwd = <contraseña maestra larga, guardada en KeePassXC>
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
; Las dos líneas siguientes ocultan el gestor de bases de datos.
; La PRIMERA vez se dejan comentadas (con ;) para poder crear la base "almichain"
; desde el navegador; después se quita el ; y se reinicia Odoo (README, apartado 4).
list_db = False
dbfilter = ^almichain$
